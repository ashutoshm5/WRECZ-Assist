[package]
name = "wrecz"
version = "1.0.0"
description = "WRECZ desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wrecz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
